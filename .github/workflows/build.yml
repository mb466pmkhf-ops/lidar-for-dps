name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: iOS app (Xcode, unsigned Release build + IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for generic iOS device
        run: |
          set -o pipefail
          xcodebuild build \
            -project FrameScout.xcodeproj \
            -scheme FrameScout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(deprecated|never|unused)|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Package unsigned IPA (for SideStore / AltStore / re-signing)
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../FrameScout-unsigned.ipa Payload)
          ls -la FrameScout-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrameScout-unsigned-ipa
          path: FrameScout-unsigned.ipa
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  core-tests:
    name: Core logic tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Swift comes from the official image. The setup-swift action checks its download against a
      # public keyserver, and the job could not start whenever that keyserver was down. Only this
      # step runs in the image; the checks below use the runner's own Node and Python.
      - name: Run core tests
        run: docker run --rm -v "$PWD":/src -v /tmp:/tmp -w /src swift:6.1-noble ./Tests/run_core_tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look sheet (Docs/LOOK.md)
        run: node scripts/check-look.mjs
      - name: Web planner matches the Swift lighting maths
        working-directory: web
        run: |
          npm ci
          test -f /tmp/framescout-core-tests/parity-readings.json
          test -f /tmp/framescout-core-tests/photometrics-matrix.json
          test -f /tmp/framescout-core-tests/stage-readings.json
          STAGE_READINGS=/tmp/framescout-core-tests/stage-readings.json PARITY_READINGS=/tmp/framescout-core-tests/parity-readings.json PHOTOMETRICS_MATRIX=/tmp/framescout-core-tests/photometrics-matrix.json npx vitest run
      - name: Validate GLB with the Khronos glTF validator
        run: |
          npm install --no-save gltf-validator@2.0.0-dev.3.10
          node -e "
            const v = require('gltf-validator'); const fs = require('fs');
            for (const f of ['test.glb', 'object.glb']) {
              v.validateBytes(new Uint8Array(fs.readFileSync('/tmp/framescout-core-tests/' + f))).then(r => {
                console.log(f, JSON.stringify(r.issues, null, 1));
                if (r.issues.numErrors > 0) process.exit(1);
              });
            }"
      - name: Validate USD with Pixar USD
        run: |
          pip install --quiet usd-core
          python3 -c "
          from pxr import Usd, UsdGeom
          for f in ['test.usda', 'test.usdz']:
              s = Usd.Stage.Open('/tmp/framescout-core-tests/' + f)
              assert UsdGeom.GetStageUpAxis(s) == 'Y' and UsdGeom.GetStageMetersPerUnit(s) == 1.0
              print(f, 'ok', len(list(s.Traverse())), 'prims')
          "
